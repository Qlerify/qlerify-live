# Fly.io config for qlerify-live (main — multi-tenant platform).
# Single machine + one persistent volume (SQLite DB + runtime model cache on /data).
# Do NOT scale beyond 1 machine — each machine gets its own volume, splitting state.
# Deploy with: fly deploy --ha=false
app = "qlerify-live"
primary_region = "arn"  # Stockholm

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  # Bind all interfaces inside the machine — Fly's proxy fronts it (force_https).
  HOST = "0.0.0.0"
  # Fly's proxy is one hop; without this every request's req.ip is the proxy's
  # address and the per-IP login rate limit is one shared bucket.
  TRUST_PROXY = "true"
  # SQLite file lives on the mounted volume so it survives restarts/redeploys.
  DATABASE_URL = "file:/data/dev.db"

# Persistent volume — created once with: fly volumes create data --size 1 --region arn
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Keep one machine always warm so the live demo has no cold-start lag.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # /healthz is auth-exempt and proves the DB answers, not just that the
  # static shell serves.
  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
